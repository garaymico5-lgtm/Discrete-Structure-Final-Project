<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BISU Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #ecf0f1; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .full { grid-column: 1 / -1; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { padding: 10px; width: 100%; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-blue { background: #3498db; } .btn-orange { background: #f39c12; } .btn-green { background: #2ecc71; } .btn-red { background: #e74c3c; }
        .terminal { background: #2c3e50; color: #ecf0f1; padding: 15px; border-radius: 4px; font-family: monospace; white-space: pre-wrap; font-size: 0.85em; }
        .matrix-table { width: 100%; border-collapse: collapse; font-size: 0.8em; margin-top: 10px; }
        .matrix-table th, .matrix-table td { border: 1px solid #ddd; padding: 5px; text-align: center; }
        .matrix-table th { background: #2c3e50; color: white; }
        .granted { background: #d4edda; } .denied { background: #f8d7da; }
        .note { font-size: 0.8em; color: #666; }
    </style>
</head>
<body>
    <div id="app-data" data-matrix='{{ data | tojson }}' hidden></div>
    <div class="container">
        <div class="card full" style="background:#2c3e50; color:white; display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0;">Campus Dashboard <small style="font-weight:normal;">(Logged in: {{ user }})</small></h2>
            <button class="btn-red" style="width:auto; margin:0; padding:8px 15px;" onclick="window.location.href='/logout'">Logout</button>
        </div>

        <div class="card">
            <h3>Navigation</h3>
            <input type="text" id="startLoc" value="Main Gate" placeholder="Start">
            <input type="text" id="destLoc" value="Science Hall" placeholder="Destination">
            <button class="btn-blue" onclick="doNavigate()">Find Path</button>
            <div class="terminal" id="navOut">Ready...</div>
        </div>

        <div class="card">
            <h3>Live Monitoring</h3>
            <button class="btn-orange" onclick="doMonitor()">Refresh Data</button>
            <div class="terminal" id="monOut" style="height:100px;">No data.</div>

            <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">

            <h3>Add User</h3>
            <input type="text" id="newId" placeholder="New User ID (e.g. S099)">
            <select id="newType">
                <option value="student">Student</option>
                <option value="faculty">Faculty</option>
                <option value="staff">Staff</option>
                <option value="visitor">Visitor</option>
            </select>
            <button class="btn-green" onclick="doAddUser()">Add to Matrix</button>
            <div id="addMsg" style="font-weight:bold; font-size:0.9em;"></div>
        </div>

        <div class="card full">
            <h3>Access Matrix</h3>
            <div class="note">Shows effective access: Exists AND Authorized AND NOT Restricted AND has room permission. Level = number of rooms accessible.</div>
            <table class="matrix-table" id="matrixTable"></table>
        </div>
    </div>

    <script>
        const matrixData = JSON.parse(document.getElementById('app-data').dataset.matrix);

        function renderMatrix() {
            const t = document.getElementById('matrixTable');
            let html = '<tr><th>User</th>';
            matrixData.headers.forEach(r => html += `<th>${r}</th>`);
            html += '<th>Lvl</th></tr>';
            matrixData.rows.forEach(row => {
                html += `<tr><td>${row.user}</td>`;
                row.permissions.forEach(p => html += `<td class="${p===1?'granted':'denied'}">${p}</td>`);
                html += `<td>${row.level}</td></tr>`;
            });
            t.innerHTML = html;
        }
        renderMatrix();

        async function doNavigate() {
            const out = document.getElementById('navOut');
            out.innerText = "Calculating...";
            const res = await fetch('/api/navigate', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({start: document.getElementById('startLoc').value,
                                      destination: document.getElementById('destLoc').value})
            });
            if (res.status === 401) { window.location.href = '/'; return; }
            const data = await res.json();
            out.innerText = data.error
                ? `❌ ${data.error}`
                : `✅ Path: ${data.path}\n📏 Dist: ${data.distance}\n🔐 Code: ${data.access_code}\n⏱ Wait: ${data.simulated_wait_time}`;
        }

        async function doMonitor() {
            const out = document.getElementById('monOut');
            out.innerText = "Fetching...";
            const res = await fetch('/api/monitoring');
            if (res.status === 401) { window.location.href = '/'; return; }
            const data = await res.json();
            out.innerText = data.data.map(r => `${r.room}: ${r.people}/${r.capacity} (${r.status})`).join('\n');
        }

        async function doAddUser() {
            const msg = document.getElementById('addMsg');
            const res = await fetch('/api/add_user', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: document.getElementById('newId').value,
                                      user_type: document.getElementById('newType').value})
            });
            if (res.status === 401) { window.location.href = '/'; return; }
            const data = await res.json();
            msg.style.color = res.ok ? "green" : "red";
            msg.innerText = res.ok ? `✅ ${data.message}` : `❌ ${data.error}`;
            if (res.ok) setTimeout(() => window.location.reload(), 1000);
        }
    </script>
</body>
</html>
